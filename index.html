<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전남대 국문과 서울·경기 답사 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1100;
    background: #1a4d7c; color: #fff; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #topbar h1 { font-size: 15px; margin: 0; flex: 1 1 auto; }
  #submitBtn { background: #f39c12; color: #fff; text-decoration: none;
    padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: bold; }
  #topbar select { font-size: 12px; padding: 4px; border-radius: 4px; border: 0; max-width: 28vw; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  .leaflet-top.leaflet-left { margin-top: 84px; }
  #legend { position: fixed; bottom: 12px; left: 12px; z-index: 1100;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 70vw; }
  #legend label { display: block; cursor: pointer; margin: 2px 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #banner { position: fixed; top: 84px; left: 0; right: 0; z-index: 1100;
    background: #c0392b; color: #fff; text-align: center; padding: 6px;
    font-size: 13px; display: none; }
  .leaflet-popup-content { font-size: 13px; max-width: 78vw; }
  .sub-card { border-top: 1px solid #ddd; margin-top: 6px; padding-top: 6px; }
  .sub-card .badge { display: inline-block; font-size: 11px; color: #fff;
    background: #f39c12; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
  .sub-card img { max-width: 100%; border-radius: 4px; margin-top: 4px; }
</style>
</head>
<body>
<div id="topbar">
  <h1>전남대 국문과 답사 지도</h1>
  <select id="teamFilter"><option value="">전체 팀</option></select>
  <select id="typeFilter">
    <option value="">전체 유형</option>
    <option>답사 기록</option>
    <option>미션: 말모이</option>
    <option>미션: 구보</option>
    <option>미션: 운영전 낭독</option>
  </select>
  <a id="submitBtn" href="#" target="_blank" rel="noopener">+ 자료 올리기</a>
</div>
<div id="banner"></div>
<div id="map"></div>
<div id="legend"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
"use strict";
const CONFIG = {
  csvUrl: "PASTE_PUBLISHED_CSV_URL",   // 구글 시트 "웹에 게시" CSV 주소로 교체
  formUrl: "PASTE_GOOGLE_FORM_URL",    // 구글폼 주소로 교체
  refreshMs: 5 * 60 * 1000,
  center: [37.578, 126.977],
  zoom: 13
};

const state = { poiData: null, poiById: {}, markers: {}, courseLayers: {}, map: null };

function courseColor(courseId) {
  const c = state.poiData.courses[courseId];
  return c ? c.color : "#7f8c8d";
}

function initMap() {
  state.map = L.map("map", { zoomControl: true }).setView(CONFIG.center, CONFIG.zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(state.map);
  document.getElementById("submitBtn").href = CONFIG.formUrl;
}

function renderPois() {
  const byCourse = {};
  for (const p of state.poiData.pois) {
    state.poiById[p.name] = p;
    const layer = state.courseLayers[p.course] ||
      (state.courseLayers[p.course] = L.layerGroup().addTo(state.map));
    const m = L.circleMarker([p.lat, p.lng], {
      radius: 8, color: "#fff", weight: 2,
      fillColor: courseColor(p.course), fillOpacity: 0.95
    }).addTo(layer);
    m.bindPopup(`<b>${p.name}</b><br>${p.desc}`);
    state.markers[p.id] = m;
    if (p.order > 0) (byCourse[p.course] = byCourse[p.course] || []).push(p);
  }
  for (const [cid, list] of Object.entries(byCourse)) {
    list.sort((a, b) => a.order - b.order);
    L.polyline(list.map(p => [p.lat, p.lng]), {
      color: courseColor(cid), weight: 3, opacity: 0.5, dashArray: "6 6"
    }).addTo(state.courseLayers[cid]);
  }
  renderLegend();
}

function renderLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(state.poiData.courses)
    .filter(([cid]) => cid !== "etc")
    .map(([cid, c]) =>
      `<label><input type="checkbox" data-course="${cid}" checked>` +
      `<span class="dot" style="background:${c.color}"></span>${c.name}</label>`).join("");
  el.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
    const layer = state.courseLayers[cb.dataset.course];
    if (!layer) return;
    cb.checked ? layer.addTo(state.map) : state.map.removeLayer(layer);
  }));
}

function showBanner(msg) {
  const el = document.getElementById("banner");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function driveThumbs(cell) {
  if (!cell) return [];
  return cell.split(/[\s,]+/).filter(Boolean).map(u => {
    const m = u.match(/[-\w]{25,}/);
    return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w400` : null;
  }).filter(Boolean);
}

function subCard(row) {
  const photos = driveThumbs(row["사진"])
    .map(src => `<a href="${src.replace("&sz=w400", "&sz=w1600")}" target="_blank" rel="noopener">` +
                `<img src="${src}" loading="lazy" alt="제출 사진" ` +
                `onerror="this.outerHTML='<a href=&quot;${src}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>첨부 파일 열기</a>'"></a>`)
    .join("");
  const type = row["제출 유형"] || "답사 기록";
  const badge = type === "답사 기록" ? "" : `<span class="badge">${esc(type)}</span>`;
  return `<div class="sub-card"><b>${esc(row["팀"] || "?")}</b>${badge}` +
         `<div>${esc(row["내용"] || "")}</div>${photos}</div>`;
}

function buildPoiPopup(poi) {
  const subs = state.subsByPoi[poi.name] || [];
  const head = `<b>${poi.name}</b><br>${poi.desc}`;
  if (!subs.length) return head + `<div class="sub-card">아직 올라온 자료가 없어요.</div>`;
  return head + `<div style="max-height:45vh;overflow-y:auto">${subs.map(subCard).join("")}</div>`;
}

function attachSubmissions(rows) {
  state.subsByPoi = {};
  if (state.dynamicLayer) state.map.removeLayer(state.dynamicLayer);
  state.dynamicLayer = L.layerGroup().addTo(state.map);
  const unmatched = [];
  for (const row of rows) {
    const site = (row["답사지"] || "").trim();
    const lat = parseFloat(row["위도"]), lng = parseFloat(row["경도"]);
    if (state.poiById[site]) {
      (state.subsByPoi[site] = state.subsByPoi[site] || []).push(row);
    } else if (!isNaN(lat) && !isNaN(lng)) {
      L.circleMarker([lat, lng], {
        radius: 7, color: "#fff", weight: 2,
        fillColor: courseColor("etc"), fillOpacity: 0.95
      }).addTo(state.dynamicLayer)
        .bindPopup(`<b>${esc(row["기타 장소명"] || "직접 입력 장소")}</b>` + subCard(row));
    } else {
      unmatched.push(row);
    }
  }
  for (const p of state.poiData.pois) {
    state.markers[p.id].bindPopup(buildPoiPopup(p));
    const subs = state.subsByPoi[p.name] || [];
    state.markers[p.id].setRadius(subs.length > 0 ? Math.min(8 + subs.length, 16) : 8);
    const hasMission = subs.some(r => (r["제출 유형"] || "").startsWith("미션"));
    state.markers[p.id].setStyle({ color: hasMission ? "#f39c12" : "#fff", weight: hasMission ? 3 : 2 });
  }
  renderUnmatched(unmatched);
}

function renderUnmatched(rows) {
  let el = document.getElementById("unmatched");
  if (!el) {
    el = document.createElement("div");
    el.id = "unmatched";
    el.style.cssText = "position:fixed;bottom:12px;right:12px;z-index:1100;" +
      "background:rgba(255,255,255,.95);border-radius:8px;padding:8px 10px;" +
      "font-size:12px;max-width:60vw;max-height:30vh;overflow-y:auto;" +
      "box-shadow:0 1px 4px rgba(0,0,0,.3)";
    document.body.appendChild(el);
  }
  if (!rows.length) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = `<b>위치 미확정 제출 ${rows.length}건</b> (운영자가 시트에서 좌표를 채우면 지도에 표시됩니다)` +
    rows.map(r => `<div class="sub-card"><b>${esc(r["팀"] || "?")}</b> ${esc(r["답사지"] || "")} ${esc(r["기타 장소명"] || "")}` +
      `<div>${esc(r["내용"] || "")}</div></div>`).join("");
}

function loadSubmissions() {
  const test0 = new URLSearchParams(location.search).get("data");
  const test = test0 && /^https?:/i.test(test0) ? null : test0;
  const url = test || CONFIG.csvUrl;
  if (url.startsWith("PASTE_")) { showBanner("CONFIG.csvUrl이 아직 설정되지 않았습니다."); return; }
  Papa.parse(url, {
    download: true, header: true, skipEmptyLines: true,
    complete: res => {
      showBanner("");
      state.allRows = res.data;
      fillTeamFilter();
      applyFilters();
    },
    error: () => showBanner("자료를 불러오지 못했습니다. 잠시 후 자동으로 다시 시도합니다.")
  });
}

function fillTeamFilter() {
  const sel = document.getElementById("teamFilter");
  const current = sel.value;
  const teams = [...new Set(state.allRows.map(r => (r["팀"] || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
  sel.innerHTML = `<option value="">전체 팀</option>` +
    teams.map(t => `<option${t === current ? " selected" : ""}>${esc(t)}</option>`).join("");
}

function applyFilters() {
  if (!state.allRows) return;
  const team = document.getElementById("teamFilter").value;
  const type = document.getElementById("typeFilter").value;
  attachSubmissions(state.allRows.filter(r =>
    (!team || (r["팀"] || "").trim() === team) &&
    (!type || (r["제출 유형"] || "").trim() === type)));
}
document.getElementById("teamFilter").addEventListener("change", applyFilters);
document.getElementById("typeFilter").addEventListener("change", applyFilters);

async function boot() {
  initMap();
  try {
    state.poiData = await (await fetch("poi.json")).json();
    renderPois();
  } catch (e) {
    showBanner("답사지 정보를 불러오지 못했습니다. 새로고침 해주세요.");
    return;
  }
  loadSubmissions();
  setInterval(loadSubmissions, CONFIG.refreshMs);
}
boot();
</script>
</body>
</html>
